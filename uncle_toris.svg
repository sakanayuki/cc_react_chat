<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700">
  <rect width="500" height="700" fill="white"/>

  <!-- ストールの脚 -->
  <rect x="228" y="580" width="22" height="95" fill="#111"/>
  <!-- ストールの足元 -->
  <ellipse cx="239" cy="674" rx="55" ry="14" fill="#111"/>
  <!-- ストールの座面 -->
  <rect x="160" y="548" width="158" height="38" rx="4" fill="#c97a1a"/>

  <!-- 左脚（黒） -->
  <path d="M185,548 L150,595 L110,645 L95,635 L138,582 L175,538 Z" fill="#111"/>
  <!-- 右脚（黒） -->
  <path d="M295,548 L330,600 L350,588 L318,535 Z" fill="#111"/>

  <!-- ボディ（赤い上着）メイン -->
  <path d="
    M155,375
    L175,330
    L230,310
    L270,310
    L330,330
    L355,375
    L345,540
    L160,540
    Z
  " fill="#d42222"/>

  <!-- ジャケットのラペル（白い胸元） -->
  <path d="M225,318 L250,360 L275,318 L258,308 L242,308 Z" fill="white"/>

  <!-- 蝶ネクタイ -->
  <path d="M225,342 L250,355 L275,342 L250,332 Z" fill="#111"/>

  <!-- 左腕（グラスを持つ） -->
  <path d="M168,390 L110,435 L88,495 L105,502 L130,450 L182,408 Z" fill="#d42222"/>

  <!-- 左手 -->
  <path d="M82,490 L72,520 L95,530 L108,498 Z" fill="#e8a080"/>
  <!-- 指 -->
  <line x1="80" y1="513" x2="68" y2="528" stroke="#e8a080" stroke-width="9" stroke-linecap="round"/>
  <line x1="90" y1="520" x2="80" y2="538" stroke="#e8a080" stroke-width="9" stroke-linecap="round"/>

  <!-- グラス本体 -->
  <path d="M52,415 L48,498 L98,498 L94,415 Z" fill="rgba(230,230,230,0.55)" stroke="#bbb" stroke-width="1.5"/>
  <!-- 氷（上） -->
  <rect x="57" y="430" width="18" height="18" rx="2" fill="white" stroke="#ccc" stroke-width="1" transform="rotate(-12,66,439)"/>
  <rect x="73" y="425" width="16" height="16" rx="2" fill="white" stroke="#ccc" stroke-width="1" transform="rotate(8,81,433)"/>
  <!-- 氷（下） -->
  <rect x="60" y="452" width="17" height="17" rx="2" fill="white" stroke="#ccc" stroke-width="1" transform="rotate(5,68,460)"/>
  <rect x="76" y="447" width="15" height="15" rx="2" fill="white" stroke="#ccc" stroke-width="1" transform="rotate(-8,83,454)"/>
  <!-- ウィスキー液体 -->
  <path d="M49,475 L49,498 L97,498 L97,475 Z" fill="rgba(210,175,50,0.65)"/>
  <!-- バブル -->
  <circle cx="60" cy="488" r="3" fill="rgba(255,255,200,0.7)"/>
  <circle cx="80" cy="482" r="2.5" fill="rgba(255,255,200,0.7)"/>
  <circle cx="70" cy="491" r="2" fill="rgba(255,255,200,0.7)"/>

  <!-- 右手（ひざに置いた手） -->
  <path d="M338,488 L365,502 L360,522 L330,508 Z" fill="#e8a080"/>
  <!-- 指 -->
  <line x1="362" y1="504" x2="378" y2="518" stroke="#e8a080" stroke-width="9" stroke-linecap="round"/>
  <line x1="355" y1="510" x2="368" y2="528" stroke="#e8a080" stroke-width="9" stroke-linecap="round"/>
  <line x1="346" y1="514" x2="354" y2="534" stroke="#e8a080" stroke-width="9" stroke-linecap="round"/>

  <!-- 頭部（大きく丸い） -->
  <ellipse cx="248" cy="198" rx="138" ry="155" fill="#e8a080"/>

  <!-- 耳 -->
  <path d="M370,215 Q402,230 388,270 Q382,285 370,278" stroke="#111" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- 眉毛 -->
  <rect x="198" y="163" width="26" height="9" rx="2" fill="#222"/>
  <rect x="246" y="163" width="26" height="9" rx="2" fill="#222"/>

  <!-- 目（白目） -->
  <ellipse cx="214" cy="185" rx="14" ry="13" fill="white"/>
  <ellipse cx="260" cy="185" rx="14" ry="13" fill="white"/>
  <!-- 瞳 -->
  <circle cx="216" cy="187" r="8" fill="#222"/>
  <circle cx="262" cy="187" r="8" fill="#222"/>

  <!-- 鼻の点線 -->
  <line x1="242" y1="200" x2="268" y2="212" stroke="#555" stroke-width="2.5" stroke-dasharray="5,5"/>

  <!-- 笑み -->
  <path d="M208,248 Q248,278 290,250" stroke="#c03040" stroke-width="4.5" fill="none" stroke-linecap="round"/>

  <!-- 署名 -->
  <text x="370" y="685" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#444">Ryo.</text>
</svg>
